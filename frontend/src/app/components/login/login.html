<div class="min-h-screen bg-slate-950 py-12 px-4 flex justify-center items-start text-slate-100">
  <div class="w-full max-w-[500px] p-6 bg-slate-900 rounded-xl shadow-2xl border border-slate-800">

    <h2 class="text-2xl font-bold text-white mb-1">Accedi a Eclettici</h2>
    <p class="text-slate-400 mb-6 text-sm">Inserisci le tue credenziali per accedere ai servizi protetti.</p>

    <!-- Box Messaggio di Successo -->
    @if (successMessage) {
      <div class="p-4 mb-4 bg-emerald-500/10 border-l-4 border-emerald-500 text-emerald-400 rounded-r-lg font-medium shadow-sm text-sm transition-all">
        <div class="flex items-center">
          <span class="mr-2">✔</span>
          <span>{{ successMessage }}</span>
        </div>
      </div>
    }

    <!-- Box Elenco Errori -->
    @if (errorMessages.length > 0) {
      <div class="p-4 mb-4 bg-rose-500/10 border-l-4 border-rose-500 text-rose-400 rounded-r-lg font-medium shadow-sm text-sm transition-all">
        <div class="flex items-start mb-1">
          <span class="mr-2 font-bold">⚠</span>
          <span class="font-semibold text-rose-300">Errore di autenticazione:</span>
        </div>
        <ul class="margin-0 pl-5 list-disc space-y-1">
          @for (error of errorMessages; track error) {
            <li>{{ error }}</li>
          }
        </ul>
      </div>
    }

    <form (ngSubmit)="onLogin()" class="space-y-4">

      <!-- Campo Email -->
      <div>
        <label class="block mb-1 text-sm font-semibold text-slate-300">Indirizzo Email::</label>
        <input type="email" name="email" [(ngModel)]="formData.email" required
               class="w-full px-4 py-2 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-white placeholder-slate-500 bg-slate-950/60 transition-all"
               placeholder="esempio@dominio.com">
      </div>

      <!-- Campo Password -->
      <div>
        <label class="block mb-1 text-sm font-semibold text-slate-300">Password</label>

        <div class="relative">
          <input
            [type]="hidePassword ? 'password' : 'text'"
            name="password"
            [(ngModel)]="formData.password"
            required
            class="w-full px-4 py-2 border border-slate-700 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-white placeholder-slate-500 bg-slate-950/60 transition-all pr-10"
            placeholder="••••••••">

          <button
            type="button"
            (click)="togglePasswordVisibility()"
            class="absolute inset-y-0 right-0 flex items-center pr-3 text-slate-400 hover:text-slate-200 cursor-pointer">
            @if (hidePassword) {
              👁️
            } @else {
              🙈
            }
          </button>
        </div>
      </div>

      <!-- Pulsante di Invio -->
      <button type="submit"
              class="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transition-all active:transform active:scale-[0.98] cursor-pointer">
        Accedi
      </button>

    </form>
  </div>
</div>
