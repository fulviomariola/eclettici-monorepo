<div class="min-h-screen bg-slate-950 p-6 text-slate-100 flex items-center justify-center">
  <div class="max-w-2xl w-full bg-slate-900 rounded-2xl shadow-xl border border-slate-800 p-8 space-y-8">

    <!-- HEADER -->
    <div class="flex justify-between items-center border-b border-slate-800 pb-6">
      <div>
        <h1 class="text-2xl font-bold text-white">Profilo Utente</h1>
        <p class="text-slate-400 text-xs">Gestisci le informazioni del tuo account e le credenziali di accesso</p>
      </div>
      <button (click)="goBack()"
              class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 font-semibold rounded-xl text-xs transition-all cursor-pointer">
        ← Torna alla Dashboard
      </button>
    </div>

    <!-- MESSAGGI -->
    <div *ngIf="successMessage" class="p-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-xl text-sm">
      {{ successMessage }}
    </div>
    <div *ngIf="errorMessage" class="p-4 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-xl text-sm">
      {{ errorMessage }}
    </div>

    <!-- SCHEDA DATI ACCOUNT -->
    <div appScrollFade class="bg-slate-800/40 p-6 rounded-2xl border border-slate-800 space-y-4">
      <h2 class="text-sm font-bold text-indigo-400 uppercase tracking-wider">Dati Account</h2>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Email Registrata</label>
          <p class="text-sm font-medium text-white bg-slate-900 px-3 py-2 rounded-xl border border-slate-700/60">
            {{ userProfile?.email || 'Caricamento...' }}
          </p>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-400 mb-1">Ruolo Assegnato</label>
          <p class="text-sm font-medium text-amber-400 bg-slate-900 px-3 py-2 rounded-xl border border-slate-700/60">
            {{ userProfile?.role || 'Caricamento...' }}
          </p>
        </div>
      </div>
    </div>

    <!-- FORM CAMBIO PASSWORD -->
    <div appScrollFade class="bg-slate-800/40 p-6 rounded-2xl border border-slate-800">
      <h2 class="text-sm font-bold text-amber-400 uppercase tracking-wider mb-4">Modifica Password</h2>

      <form (ngSubmit)="onChangePassword($event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Password Attuale</label>
          <input type="password" [(ngModel)]="passwordData.currentPassword" name="currentPassword" required
                 class="w-full px-3 py-2 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-900 text-white text-sm"
                 placeholder="Inserisci la password corrente">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Nuova Password</label>
          <input type="password" [(ngModel)]="passwordData.newPassword" name="newPassword" required
                 class="w-full px-3 py-2 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-900 text-white text-sm"
                 placeholder="Almeno 6 caratteri">
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-300 mb-1">Conferma Nuova Password</label>
          <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
                 class="w-full px-3 py-2 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-900 text-white text-sm"
                 placeholder="Ripeti la nuova password">
        </div>

        <button type="submit"
                class="w-full py-2.5 bg-amber-600 hover:bg-amber-500 text-white font-semibold rounded-xl text-sm transition-all cursor-pointer shadow-sm mt-2">
          Aggiorna Password
        </button>
      </form>
    </div>

  </div>
</div>
