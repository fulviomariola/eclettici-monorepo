<div appScrollFade class="space-y-6 mb-12">

  <div class="border-l-4 border-purple-500 pl-4">
    <h2 class="text-xl font-bold text-white">Modulo Invio Email Massive</h2>
    <p class="text-slate-400 text-sm">Spedisci comunicazioni o newsletter agli iscritti e ai contatti</p>
  </div>

  <div *ngIf="successMessage" class="p-4 bg-emerald-500/10 border border-emerald-500/20 text-emerald-400 rounded-xl text-sm">
    {{ successMessage }}
  </div>
  <div *ngIf="errorMessage" class="p-4 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-xl text-sm">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onSendBulkEmail($event)" class="space-y-4 bg-slate-800/40 p-6 rounded-2xl border border-slate-800">

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Target Destinatari</label>
      <select [(ngModel)]="emailData.target" name="target"
              class="w-full px-3 py-2 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 bg-slate-900 text-white text-sm">
        <option value="ALL_SUBSCRIBERS">Tutti gli Iscritti alla Newsletter (ALL_SUBSCRIBERS)</option>
        <option value="ALL_LEADS">Tutti i Contatti dalla Landing Page (ALL_LEADS)</option>
      </select>
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Oggetto dell'Email</label>
      <input type="text" [(ngModel)]="emailData.subject" name="subject" required
             class="w-full px-3 py-2 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 bg-slate-900 text-white text-sm"
             placeholder="es. Novità ed aggiornamenti della piattaforma">
    </div>

    <div>
      <label class="block text-xs font-semibold text-slate-300 mb-1">Corpo del Messaggio</label>
      <textarea [(ngModel)]="emailData.body" name="body" rows="6" required
                class="w-full px-3 py-2 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500 bg-slate-900 text-white text-sm"
                placeholder="Scrivi qui il messaggio per i destinatari..."></textarea>
    </div>

    <button type="submit" [disabled]="isSending"
            class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 disabled:bg-slate-700 text-white font-semibold rounded-xl text-sm transition-all cursor-pointer shadow-sm">
      {{ isSending ? 'Invio in corso...' : '✉️ Avvia Invio Massivo' }}
    </button>

  </form>

</div>
